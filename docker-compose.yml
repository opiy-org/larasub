version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: larasub_app
    volumes:
      - ./:/var/www/html
    environment:
      # Эти переменные будут использованы workbench/.env
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: workbench
      DB_USERNAME: workbench
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - larasub_net

  web:
    image: nginx:1.27-alpine
    container_name: larasub_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - larasub_net

  db:
    image: mysql:8.0
    container_name: larasub_db
    command: ["--default-authentication-plugin=mysql_native_password", "--innodb_use_native_aio=0"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: workbench
      MYSQL_USER: workbench
      MYSQL_PASSWORD: secret
    ports:
      - "33060:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uworkbench", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - larasub_net

  redis:
    image: redis:7-alpine
    container_name: larasub_redis
    ports:
      - "63790:6379"
    networks:
      - larasub_net

volumes:
  db_data:

networks:
  larasub_net:
    driver: bridge
